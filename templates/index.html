<!DOCTYPE html>
<html>
<head>
    <style>
    .hidden {
        display: none;
    }
    .modal {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    background: white;
    padding: 20px;
    border: 1px solid black;
}
    #modal-backdrop {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: rgba(0, 0, 0, 0.5);
}
    .selected {
        background: lightblue;
    }
</style>
</head>
<body>

<h1>Welcome, {{ name }}!</h1>
<button id="open-search">Search Food</button>
<div id="modal-backdrop" class="hidden"></div>
<div id="search-modal" class="modal hidden">
    <h2>Search Food</h2>

    <form name="search" method="POST" action="/search">
    What did you eat today? <input type="text" name="food">
    How many Grams/Ml? <input type="text" name="amount">
    <button type="submit" value="search" name="action">
        submit
    </button>
</form>

    <div id="search-results"></div>

    <button id="close-search">Close</button>
    <button id="log-food">
        Log Food
    </button>
</div>

<div id="status"></div>

<script src="/static/script.js"></script>
</body>
</html>
